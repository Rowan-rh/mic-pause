<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8" />
  <title>Mic Pause</title>
  <style>
    :root {
      --bg: #1c1c1e;
      --fg: #f5f5f7;
      --muted: #98989d;
      --accent: #34c759;
      --danger: #ff453a;
      --border: #2c2c2e;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif;
      background: var(--bg);
      color: var(--fg);
      width: 320px;
      box-sizing: border-box;
      margin: 0;
      padding: 16px;
      font-size: 13px;
    }
    h1 {
      font-size: 14px;
      font-weight: 600;
      margin: 0 0 12px 0;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--muted);
      flex-shrink: 0;
    }
    .dot.active { background: var(--danger); box-shadow: 0 0 8px var(--danger); }
    .row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 0;
      border-bottom: 1px solid var(--border);
    }
    .row:last-child { border-bottom: 0; }
    .label { color: var(--fg); }
    .sub { color: var(--muted); font-size: 11px; margin-top: 2px; }
    .toggle {
      position: relative;
      width: 36px;
      height: 22px;
      background: #3a3a3c;
      border-radius: 11px;
      cursor: pointer;
      transition: background 0.2s;
      flex-shrink: 0;
    }
    .toggle.on { background: var(--accent); }
    .toggle::after {
      content: "";
      position: absolute;
      top: 2px;
      left: 2px;
      width: 18px;
      height: 18px;
      background: white;
      border-radius: 50%;
      transition: transform 0.2s;
    }
    .toggle.on::after { transform: translateX(14px); }
    .status {
      font-size: 11px;
      color: var(--muted);
      margin-top: 8px;
      padding: 6px 8px;
      background: #2c2c2e;
      border-radius: 6px;
      word-break: break-all;
    }
    .section {
      padding-top: 14px;
    }
    .section-title {
      font-weight: 600;
      margin-bottom: 4px;
    }
    .section-help {
      color: var(--muted);
      font-size: 11px;
      line-height: 1.4;
      margin: 0 0 10px;
    }
    .site-row, .site-form, .site-item {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .site-row {
      justify-content: space-between;
      padding: 8px;
      background: #2c2c2e;
      border-radius: 6px;
      margin-bottom: 8px;
    }
    .current-host {
      color: var(--muted);
      font-size: 11px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    input, button {
      font: inherit;
    }
    input {
      min-width: 0;
      flex: 1;
      padding: 7px 8px;
      color: var(--fg);
      background: #2c2c2e;
      border: 1px solid #48484a;
      border-radius: 6px;
      outline: none;
    }
    input:focus { border-color: #0a84ff; }
    button {
      color: #fff;
      background: #3a3a3c;
      border: 0;
      border-radius: 6px;
      padding: 7px 9px;
      cursor: pointer;
      white-space: nowrap;
    }
    button:hover:not(:disabled) { background: #515153; }
    button:disabled { opacity: 0.45; cursor: default; }
    .site-form button { background: #0a84ff; }
    .site-form button:hover:not(:disabled) { background: #369cff; }
    .site-list {
      list-style: none;
      padding: 0;
      margin: 8px 0 0;
      max-height: 116px;
      overflow-y: auto;
    }
    .site-item {
      justify-content: space-between;
      padding: 5px 0;
      border-bottom: 1px solid var(--border);
    }
    .site-item:last-child { border-bottom: 0; }
    .site-name {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .remove-site {
      padding: 3px 7px;
      color: var(--muted);
    }
    .site-message {
      min-height: 14px;
      color: var(--muted);
      font-size: 11px;
      margin-top: 5px;
    }
  </style>
</head>
<body>
  <h1><span id="dot" class="dot"></span> Mic Pause</h1>

  <div class="row">
    <div>
      <div class="label">启用</div>
      <div class="sub">关闭后将不自动暂停视频</div>
    </div>
    <div id="toggle" class="toggle on"></div>
  </div>

  <div class="status" id="status">连接 native host...</div>

  <section class="section" aria-labelledby="sites-title">
    <div class="section-title" id="sites-title">例外网站</div>
    <p class="section-help">麦克风打开时，这些网站的视频会继续播放。</p>
    <div class="site-row">
      <span id="current-host" class="current-host">当前网站</span>
      <button id="toggle-current-site" type="button" disabled>加入例外</button>
    </div>
    <form id="add-site-form" class="site-form">
      <input id="site-input" type="text" placeholder="输入域名，例如 example.com" autocomplete="off" />
      <button type="submit">添加</button>
    </form>
    <ul id="site-list" class="site-list"></ul>
    <div id="site-message" class="site-message" aria-live="polite"></div>
  </section>

  <script src="popup.js"></script>
</body>
</html>
