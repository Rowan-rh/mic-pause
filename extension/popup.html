<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8" />
  <title>Mic Pause</title>
  <style>
    :root {
      --bg: #1c1c1e;
      --fg: #f5f5f7;
      --muted: #98989d;
      --accent: #34c759;
      --danger: #ff453a;
      --border: #2c2c2e;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif;
      background: var(--bg);
      color: var(--fg);
      width: 280px;
      margin: 0;
      padding: 16px;
      font-size: 13px;
    }
    h1 {
      font-size: 14px;
      font-weight: 600;
      margin: 0 0 12px 0;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--muted);
      flex-shrink: 0;
    }
    .dot.active { background: var(--danger); box-shadow: 0 0 8px var(--danger); }
    .row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 0;
      border-bottom: 1px solid var(--border);
    }
    .row:last-child { border-bottom: 0; }
    .label { color: var(--fg); }
    .sub { color: var(--muted); font-size: 11px; margin-top: 2px; }
    .toggle {
      position: relative;
      width: 36px;
      height: 22px;
      background: #3a3a3c;
      border-radius: 11px;
      cursor: pointer;
      transition: background 0.2s;
      flex-shrink: 0;
    }
    .toggle.on { background: var(--accent); }
    .toggle::after {
      content: "";
      position: absolute;
      top: 2px;
      left: 2px;
      width: 18px;
      height: 18px;
      background: white;
      border-radius: 50%;
      transition: transform 0.2s;
    }
    .toggle.on::after { transform: translateX(14px); }
    .status {
      font-size: 11px;
      color: var(--muted);
      margin-top: 8px;
      padding: 6px 8px;
      background: #2c2c2e;
      border-radius: 6px;
      word-break: break-all;
    }
  </style>
</head>
<body>
  <h1><span id="dot" class="dot"></span> Mic Pause</h1>

  <div class="row">
    <div>
      <div class="label">启用</div>
      <div class="sub">关闭后将不自动暂停视频</div>
    </div>
    <div id="toggle" class="toggle on"></div>
  </div>

  <div class="status" id="status">连接 native host...</div>

  <script src="popup.js"></script>
</body>
</html>
